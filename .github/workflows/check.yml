# Runs every check and every test on every push to a branch and on pull requests (DEVELOPMENT-POLICY
# §6). Tags start no run: a release tag points at the release commit, which ran here when it was
# pushed to main.
# Job "build": after the checks, every branch push also builds the plugin and keeps the .snplg as an
# artifact for 30 days, with TESTING.md next to it (docs/dev/RELEASING.md §4,
# docs/dev/history/technical-design-release-scaffolding.md §4).
name: check

on:
  push:
    # Branches only: with a branch filter and no tag filter, a pushed tag starts no run.
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  build:
    needs: check
    if: github.event_name == 'push'
    # buildPlugin.ps1 is PowerShell and calls gradlew.bat; the Windows image has the Android SDK.
    runs-on: windows-latest
    timeout-minutes: 45
    # A newer push to the same branch cancels a build that is still running.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          # The build label needs the commit and the tags; the test notes need origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci --no-audit --no-fund
      - name: Build the plugin
        shell: powershell
        run: ./buildPlugin.ps1
      - name: Check the build
        id: verify
        run: node scripts/ci-build.mjs verify
      - name: Test notes (TESTING.md)
        # What the build contains and how to test it; never fails.
        continue-on-error: true
        run: node scripts/test-notes.mjs --out build/outputs/TESTING.md --branch "${{ github.ref_name }}" --before "${{ github.event.before }}" --label "${{ steps.verify.outputs.label }}"
      - name: Stop the Gradle daemon
        # Lets the Gradle cache be saved: a running daemon locks files, and tar then fails on Windows.
        if: always()
        shell: powershell
        run: if (Test-Path android\gradlew.bat) { & android\gradlew.bat -p android --stop }
      - uses: actions/upload-artifact@v7
        with:
          name: manuscript-${{ steps.verify.outputs.label }}
          path: |
            ${{ steps.verify.outputs.snplg }}
            build/outputs/TESTING.md
          retention-days: 30
          if-no-files-found: error
